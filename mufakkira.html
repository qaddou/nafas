<style>

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal','DejaVu Sans',sans-serif;font-size:15px;line-height:1.5;padding-bottom:84px}
button{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:8px}
h1{font-weight:800;font-size:21px;margin:0;color:var(--brand)}
header .sub{color:var(--muted);font-size:13px;margin-inline-start:auto}
.mode,.sbtn{border:1px solid var(--line);background:var(--surface);color:var(--brand);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.sbtn.ok{background:var(--good);border-color:var(--good);color:#fff}.sbtn.pri{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.sbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.greet{margin:4px 0 10px}.greet b{font-size:17px}.greet span{color:var(--muted);font-size:13px;display:block}
/* quick add bar */
.qadd{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qadd button{flex:1;min-width:0;border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--brand);cursor:pointer}
/* widgets */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;position:relative}
.w h2{font-size:15px;margin:0 0 6px;color:var(--brand);display:flex;align-items:center;gap:6px}
.w h2 small{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:12px}
.w.wide{grid-column:1/-1}
.empty{color:var(--muted);font-size:13px;padding:4px 0}
.empty button{margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:8px}
.kpi b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand)}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi b.g{color:var(--good)}.kpi b.r{color:var(--bad)}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:6px;background:var(--good)}
.bar i.w2{background:var(--warn)}.bar i.r{background:var(--bad)}
.li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}

.li .t span{font-size:12px;color:var(--muted)}
.li .t span.late{color:var(--bad);font-weight:700}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--brand);background:transparent;cursor:pointer;flex:none;color:#fff;font-weight:800;padding:0}
.chk.on{background:var(--good);border-color:var(--good)}
.q{flex:none;font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px}
.q1{background:rgba(192,57,43,.14);color:var(--bad)}.q2{background:rgba(31,58,95,.12);color:var(--brand)}.q3{background:rgba(201,138,18,.16);color:var(--warn)}.q4{background:var(--soft);color:var(--muted)}
.amt{font-weight:800;font-variant-numeric:tabular-nums;flex:none}

.load{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}

.warnbox{background:rgba(192,57,43,.1);color:var(--bad);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;margin-top:6px}
.hab{display:flex;flex-wrap:wrap;gap:6px}

.cats .li .t b{font-weight:500}
/* edit mode */
.wtools{display:none;gap:4px;position:absolute;top:8px;left:8px}

.editing .w{outline:2px dashed var(--accent);outline-offset:-2px}
.hiddenlist{margin-top:10px}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(15,21,32,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}

.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:4px 10px;font-size:13px;cursor:pointer}
.opts button.on{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.acts{display:flex;gap:6px;margin-top:12px;justify-content:flex-end}
.msg{font-size:12.5px;color:var(--bad);min-height:18px;margin-top:4px}
.view{display:none}.view.on{display:block}
.soon{border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted)}
.tabsm{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px;margin-bottom:10px}
.tabsm button{flex:1;border:0;background:none;border-radius:8px;padding:6px 0;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tabsm button.on{background:var(--surface);color:var(--brand)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hidden{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* nav inside each app: bottom on phone, side rail on wide screens */
nav.appnav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:4px 6px calc(6px + env(safe-area-inset-bottom))}
nav.appnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;padding:6px 0;color:var(--muted);font-weight:700;border:0;background:none;cursor:pointer;border-radius:10px}
nav.appnav button i{font-style:normal;font-size:19px;line-height:1.1}
nav.appnav button.on{color:var(--accent)}
.home-btn{border:1px solid var(--line);background:var(--surface);color:var(--brand);border-radius:16px;padding:4px 10px;font-size:13px;cursor:pointer;font-weight:700}
/* launcher */
.apps{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px}
.tileapp{display:flex;align-items:center;gap:14px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;width:100%}
.tileapp .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.tileapp .tx{flex:1;min-width:0}.tileapp .tx b{display:block;font-size:19px;font-weight:800;color:var(--brand)}
.tileapp .tx span{display:block;color:var(--muted);font-size:13px}
.tileapp .tx em{display:block;font-style:normal;font-size:14px;font-weight:700;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.tileapp .go{color:var(--muted);font-size:20px}
.ic.l{background:rgba(224,122,47,.15)}.ic.m{background:rgba(47,143,91,.15)}.ic.t{background:rgba(31,58,95,.13)}
:root[data-mode="night"] .ic.t{background:rgba(141,180,226,.18)}
.stack{display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.apps{grid-template-columns:repeat(3,1fr)}.tileapp{flex-direction:column;text-align:center;padding:22px 14px}.tileapp .go{display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}}

}

{

const $=id=>document.getElementById(id);
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const TODAY=()=>dkey(new Date());
const addDays=(k,n)=>{const d=new Date(k+'T12:00');d.setDate(d.getDate()+n);return dkey(d)};
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
// money is kept in halalas (whole numbers) so totals never drift
const toH=v=>Math.round(parseFloat(String(v).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[٫,،]/g,'.'))*100);
const num=h=>(h<0?'−':'')+(Math.abs(h)/100).toLocaleString('en-US',{maximumFractionDigits:Math.abs(h)%100?2:0});
const sar=h=>(h<0?'−':'')+(Math.abs(h)/100).toLocaleString('en-US',{maximumFractionDigits:Math.abs(h)%100?2:0})+' ر.س';

// ===== data (in the real app: sheet "life", one row per item, newest wins) =====
// L and save() come from each app
const TCATS=['العبادة','العناية الشخصية','الصحة','اللياقة','البيت','السيارة','الجامعة','العمل','المسار المهني','المال','العائلة','التعلم','المشاريع','شخصي','أخرى'];
const OCATS=['أكل','بنزين','مواصلات','رسوم الجامعة','دعم العائلة','تسوق','فواتير','صحة','ترفيه','اشتراكات','صدقة','أخرى'];
const ICATS=['راتب','دخل إضافي','مكافأة','أرباح استثمار','أخرى'];
const QS={1:'مهم وعاجل',2:'مهم',3:'عاجل',4:'لاحقًا'};
const QN={1:'مهم وعاجل',2:'مهم مو عاجل',3:'عاجل أقل أهمية',4:'لا مهم ولا عاجل'};


// ===== calculations =====
const repDue=(t,k)=>(t.due&&t.due<=k)||(t.km&&(t.km.at||0)+t.km.every-((L.set&&L.set.km)||0)<=0);
function projOpen(t){if(!t.proj)return true;let mn=99;for(const x of Object.values(L.tasks))if(x.proj===t.proj&&!x.done&&x.ph<mn)mn=x.ph;return t.ph===mn}
const openTasks=()=>{const k=TODAY();return Object.entries(L.tasks).filter(([,t])=>!t.done&&(t.rep?repDue(t,k):projOpen(t)))};
function rank(t,today){ // lower = do first
 const late=t.due&&t.due<today, dueT=t.due===today;
 return (late?0:dueT?10:20)+({1:0,2:3,3:5,4:9}[t.q]??9)+(t.due?Math.min(9,Math.max(0,(new Date(t.due)-new Date(today))/864e5)):9)/10}
function plan(){ // fill today's hours by priority, never past capacity
 const today=TODAY(),cap=L.set.cap;let used=0;const pick=[],rest=[];
 openTasks().sort((a,b)=>rank(a[1],today)-rank(b[1],today)).forEach(([id,t])=>{
  if(t.q===4&&!(t.due&&t.due<=today)){rest.push([id,t]);return}
  const m=t.est||30; if(used+m<=cap){pick.push([id,t]);used+=m}else rest.push([id,t])});
 return {pick,rest,used,cap}}
function habitDue(h,k){if(h.paused)return false;if(h.t)return true;return !h.days||!h.days.length||h.days.includes(new Date(k+'T12:00').getDay())}
function habitScore(h){ // Loop-style strength: every done day pulls it up, every missed due day pulls it down
 let s=0,k=addDays(TODAY(),-60);const m=Math.pow(.5,1/14);
 if(h.t){let d=0;for(let i=1;i<=28;i++)if((h.log[addDays(TODAY(),-i)]||0)>=(h.x||1))d++;return Math.min(100,Math.round(d/(h.t*4)*100))}
 for(let i=0;i<=60;i++,k=addDays(k,1)){if(k<(h.from||'')||!habitDue(h,k))continue;if(k===TODAY()&&!h.log[k])continue;s=s*m+((h.log[k]||0)>=(h.x||1)?1-m:0)}
 return Math.round(s*100)}
function streak(h){const ok=k=>(h.log[k]||0)>=(h.x||1);if(h.t){let n=0,ws=addDays(TODAY(),-new Date(TODAY()+'T12:00').getDay()-7);for(let i=0;i<60;i++){let c=0;for(let j=0;j<7;j++)if(ok(addDays(ws,j)))c++;if(c>=h.t)n++;else break;ws=addDays(ws,-7)}return n}
 let n=0,k=TODAY();if(!ok(k))k=addDays(k,-1);for(let i=0;i<400;i++){if(k<(h.from||''))break;if(habitDue(h,k)||h.paused){if(ok(k))n++;else if(!h.paused)break}k=addDays(k,-1)}return n}

const hm=m=>m>=60?Math.floor(m/60)+' س'+(m%60?' '+m%60+' د':''):m+' د';
function taskRow(id,t){const today=TODAY();const late=t.due&&t.due<today;
 const when=!t.due?'بدون موعد':late?'متأخرة '+Math.round((new Date(today)-new Date(t.due))/864e5)+' يوم':t.due===today?'اليوم':t.due===addDays(today,1)?'بكرة':dshort(t.due);
 return `<div class="li"><button class="chk${t.done?' on':''}" data-done="${id}" type="button" aria-label="خلصت">${t.done?'✓':''}</button><div class="t"><b>${esc(t.t)}</b><span class="${late?'late':''}">${when}</span><span> · ${esc(t.cat)} · ${hm(t.est||30)}</span></div><span class="q q${t.q}">${QS[t.q]}</span></div>`}
const dshort=k=>{const d=new Date(k+'T12:00');return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]};


// ===== core shared by نَفَس / قِرش / مُفكّرة: login, sync with the sheet, auto-update, links =====
window.__gen=(window.__gen||0)+1;const GEN=window.__gen;window.__iv=window.__iv||[];window.__iv.forEach(clearInterval);window.__iv=[];
// INGAS: الصفحة مفتوحة من Apps Script. SITE: مفتوحة من GitHub Pages وتكلم Apps Script بـ fetch

 return fetch(YQ_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})}).then(r=>{if(!r.ok)throw new Error('http '+r.status);return r.json()})}
let SYNC=load('fit-sync',{url:'',pin:''});

// ---- theme: same key as لُقمة so all apps match ----
const YQ_MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14A8 8 0 1 1 10 4a7 7 0 0 0 10 10z"/></svg>',YQ_SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>';

{const m=load('fit-mode',null);setMode(m||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'))}

// ---- items: every thing is one row in the sheet; newest edit wins ----
// ITEMS[key]={u,j} (j = JSON text, or '' when deleted). PEND = keys waiting to upload
const IK=APP_ID+'-items',PK=APP_ID+'-pending';
let ITEMS=load(IK,{}),PEND=load(PK,[]);
function itemsTo(L0,pfx=PFX){ // rebuild the app's data object from ITEMS
 const L=JSON.parse(JSON.stringify(L0));
 for(const [k,it] of Object.entries(ITEMS)){if(!it.j||!k.startsWith(pfx))continue;const rest=k.slice(pfx.length),i=rest.indexOf(':');let v;try{v=JSON.parse(it.j)}catch(e){continue}
  if(i<0){if(rest in L)L[rest]=Object.assign({},L[rest],v)}else{const c=rest.slice(0,i);if(L[c]&&typeof L[c]==='object')L[c][rest.slice(i+1)]=v}}
 return L}
function diffSave(L,SINGLE,COLL){ // compare app data with ITEMS, mark changed rows for upload
 const now=Date.now(),seen=new Set();let ch=false;
 const put=(k,v)=>{seen.add(k);const j=JSON.stringify(v);if(!ITEMS[k]||ITEMS[k].j!==j){ITEMS[k]={u:Math.max(now,(ITEMS[k]||{}).u+1||0),j};if(!PEND.includes(k))PEND.push(k);ch=true}};
 SINGLE.forEach(s=>put(PFX+s,L[s]));
 COLL.forEach(c=>Object.entries(L[c]||{}).forEach(([id,v])=>put(PFX+c+':'+id,v)));
 for(const [k,it] of Object.entries(ITEMS))if(k.startsWith(PFX)&&!seen.has(k)&&it.j){ITEMS[k]={u:Math.max(now,it.u+1),j:''};if(!PEND.includes(k))PEND.push(k);ch=true}
 if(ch){store(IK,ITEMS);store(PK,PEND);clearTimeout(window.__pt);window.__pt=setTimeout(push,800)}}
function ingest(rows){let ch=false;for(const r of rows||[]){const u=+r.u||0,cur=ITEMS[r.d];if(!cur||u>cur.u){ITEMS[r.d]={u,j:r.j||''};PEND=PEND.filter(x=>x!==r.d);ch=true}}if(ch){store(IK,ITEMS);store(PK,PEND)}return ch}
let busy=false;
async function push(){if(!GAS||!isMain()||busy||!PEND.length)return;busy=true;const ks=PEND.slice();
 const rows=ks.filter(k=>ITEMS[k]).map(k=>Object.assign({d:k,u:ITEMS[k].u,j:ITEMS[k].j},rowInfo(k,ITEMS[k].j)));
 try{const j=await gas('apiLifePost',{key:SYNC.pin,rows});
  if(j&&j.ok){PEND=PEND.filter(x=>!ks.includes(x)||(ITEMS[x]&&ITEMS[x].u>(rows.find(r=>r.d===x)||{}).u));store(PK,PEND);syncMsg('متزامن ✓ '+tnow(),true)}
  else authFail(j)}catch(e){syncMsg('ما فيه نت. محفوظ بالجهاز ويرتفع لحاله.',false)}
 busy=false;if(PEND.length)setTimeout(push,30000)}
async function pull(){if(!GAS||!isMain())return;
 try{const j=await gas('apiLifeGet',SYNC.pin,APP_KEY);if(!j||!j.ok)return authFail(j);
  const ch=ingest(j.rows);if(ch&&window.__gen===GEN)onData();syncMsg('متزامن ✓ '+tnow(),true);if(PEND.length)push()}
 catch(e){syncMsg('ما فيه نت. محفوظ بالجهاز ويرتفع لحاله.',false)}}
function rowInfo(k,j){let v={};try{v=JSON.parse(j||'{}')}catch(e){}const r=k.slice(2).split(':')[0];
 if(!j)return {t:'محذوف'};
 if(r==='tx')return {t:v.type==='in'?'دخل':v.type==='tr'?'تحويل':'مصروف',a:(v.h||0)/100,n:v.desc||v.cat||'',x:v.date||''};
 if(r==='cat')return {t:'تصنيف',n:v.name||''};
 if(r==='com')return {t:'التزام',a:(v.h||0)/100,n:v.name||'',x:v.due||''};
 if(r==='inv')return {t:'سهم',n:v.name||'',a:v.price||''};
 if(r==='iop')return {t:'عملية سهم',n:v.type||'',a:v.qty||'',x:v.date||''};
 if(r==='acc')return {t:'حساب',a:(v.open||0)/100,n:v.name||''};
 if(r==='tasks')return {t:v.done?'مهمة منجزة':'مهمة',n:v.t||'',x:v.due||''};
 if(r==='habits')return {t:'عادة',n:v.name||''};
 return {t:r}}
const tnow=()=>new Date().toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'});

function showLogin(msg){$('login').classList.remove('hidden');$('pin-msg').textContent=msg||'';setTimeout(()=>$('pin-in').focus(),50)}
async function tryLogin(){const pin=$('pin-in').value.trim();if(!pin)return;$('pin-msg').textContent='جاري الدخول...';
 if(!GAS){$('pin-msg').textContent='افتح يَقَظة من رابطها.';return}
 try{const j=await gas('apiGet',pin);
  if(j&&j.error==='locked'){$('pin-msg').textContent='الدخول مقفول 15 دقيقة بسبب محاولات غلط.';return}
  if(!j||!j.ok){$('pin-msg').textContent='الرمز غلط. جرب مرة ثانية.';return}
  SYNC={url:'',pin,who:j.who};store('fit-sync',SYNC);$('pin-in').value='';
  if(j.who==='kid'){onKid();return}
  $('login').classList.add('hidden');onLogin()}
 catch(e){$('pin-msg').textContent='ما فيه اتصال. تأكد من النت.'}}

 ['nafas','qirsh','mufakkira'].forEach(a=>{if(!load(a+'-pending',[]).length)store(a+'-items',{})});ITEMS=load(IK,{});PEND=load(PK,[]);onData();showLogin()}

 try{if(SITE){const t=await (await fetch(location.href.split('#')[0],{cache:'no-store'})).text();const m=t.match(/name="build" content="(\d+)"/);
   if(m&&m[1]!==BUILD){try{await push()}catch(e){}store('fit-updated',1);location.reload();return}}
  else{const b=await gas('apiBuild',APP_KEY);if(b&&b!==BUILD){const html=await gas('apiPage',APP_KEY);if(html&&html.length>3000){try{await push()}catch(e){}window.__iv.forEach(clearInterval);window.__iv=[];store('fit-updated',1);document.open();document.write(html);document.close();return}}}}catch(e){}bchk=false}
window.__iv.push(setInterval(()=>{if(document.visibilityState==='visible')checkBuild()},30000));
window.__iv.push(setInterval(()=>{if(document.visibilityState==='visible')pull()},60000));

// ===== مُفكّرة: فهم الجملة + قاعدة المهام (من design/mufakkira-proto.js) =====
const dow=k=>new Date(k+'T12:00').getDay();
const diff=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);

 const t={t:p.title,cat:p.cat,q:p.q,est:p.est||30,due:p.due&&p.due!=='done'?p.due:null,done:false,made:Date.now()};if(p.tm!=null)t.tm=p.tm;
 if(p.kind==='r'){t.rep=p.rep||{n:1,u:'w'};if(p.fixed)t.fixed=1;if(p.km)t.km={every:p.km,at:L.set.km||0};if(p.due==='done')roll(t);else if(!t.due)t.due=T;t.last=t.last||null}

function openMore(id){MID=id;const t=L.tasks[id];if(!t)return;const T=TODAY(),kl=kmLeft(t);

 ${t.rep?`<div class="f"><label>الجاية تنحسب</label>${o('fixed',[[0,'من يوم ما أخلصها'],[1,'بموعد ثابت']],t.fixed?1:0)}</div>
 <div class="f"><label>خلصتها في يوم ثاني؟</label><div class="opts"><input class="qin" type="date" id="me-on" max="${T}" style="width:auto" aria-label="اليوم اللي خلصتها فيه"><button type="button" data-m="doneon">سجّل</button></div></div>`:''}
 <div class="f"><label>الأهمية</label>${o('q',[1,2,3,4].map(q=>[q,QN[q]]),t.q)}</div>

document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='qa-in'){QA.text=t.value;if(!t.value.trim()){QA.ov={};QA.ed=null}renderPV();return}
 if(t.id==='pv-t'){QA.ov.title=t.value;return}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='due-in'&&t.value){QA.ov.due=t.value;QA.ed=null;renderPV();return}
 if(t.id==='me-due'&&t.value&&MID&&L.tasks[MID]){L.tasks[MID].due=t.value;save();render();openMore(MID);return}
 if(t.id==='me-t'&&MID&&L.tasks[MID]){const v=t.value.trim();if(v){L.tasks[MID].t=v;save();render()}return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='qa-in'){e.preventDefault();e.stopImmediatePropagation();const b=$('qa-add');if(b)b.click()}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,T=TODAY();
 const stop=()=>{e.stopImmediatePropagation();e.preventDefault()};
 if(d.msub){stop();MSUB=d.msub;render();return}
 if(d.qa!==undefined){stop();openAdd(d.qa);return}
 if(d.oldform){stop();close();open('task');return}
 if(d.ex){stop();QA.text=d.ex;QA.ov={};QA.ed=null;$('qa-in').value=d.ex;renderPV();return}
 if(d.ed){stop();QA.ed=QA.ed===d.ed?null:d.ed;renderPV();return}
 if(d.set){stop();const k=d.set,v=d.v,p=curP();
  if(k==='rep'){QA.ov.rep=repOf(v);if(p.kind==='o')QA.ov.kind='r'}
  else if(k==='q'||k==='est')QA.ov[k]=+v;
  else if(k==='due')QA.ov.due=v||null;
  else if(k==='kind'){QA.ov.kind=v;if(v!=='o'&&!p.rep)QA.ov.rep=v==='h'?{n:1,u:'d'}:{n:1,u:'w'};if(v==='r'&&!p.due)QA.ov.due=T}
  else QA.ov[k]=v;QA.ed=null;renderPV();return}
 if(d.repc){stop();const r={n:Math.max(1,+$(d.repc+'-n').value||1),u:$(d.repc+'-u').value};
  if(d.repc==='rc'){QA.ov.rep=r;if(curP().kind==='o')QA.ov.kind='r';QA.ed=null;renderPV()}else{const t=L.tasks[MID];t.rep=r;if(!t.due)t.due=T;save();render();openMore(MID);toast('التكرار: '+repLabel(r))}return}
 if(d.kmc){stop();const v=+$(d.kmc+'-km').value||0;
  if(d.kmc==='rc'){QA.ov.km=v||null;if(v&&curP().kind==='o'){QA.ov.kind='r';QA.ov.rep=QA.ov.rep||{n:6,u:'m'}}QA.ed=null;renderPV()}else{const t=L.tasks[MID];if(v){t.km={every:v,at:(t.km&&t.km.at)||L.set.km||0};if(!t.rep){t.rep={n:6,u:'m'};t.due=t.due||T}}else delete t.km;save();render();openMore(MID)}return}
 if(b.id==='qa-add'){stop();const p=curP();if(!p||!p.title.trim()){toast('اكتب اسم الشي');return}if(p.kind==='p'){openPlan(p);return}addFromP(p);close();QA.text='';QA.ov={};render();return}
 if(d.more){stop();openMore(d.more);return}
 if(d.done&&L.tasks[d.done]&&L.tasks[d.done].rep&&!L.tasks[d.done].done){stop();const t=L.tasks[d.done];roll(t);save();render();toast('أحسنت ✓ الجاية '+rel(t.due));return}
 if(d.m&&MID&&L.tasks[MID]){stop();const t=L.tasks[MID];
  if(d.m==='done'){if(t.rep){roll(t);toast('✓ الجاية '+rel(t.due))}else{t.done=true;t.doneAt=T;toast('أحسنت ✓')}}
  else if(d.m==='undo'){t.done=false;t.doneAt=null}
  else if(d.m==='doneon'){const v=$('me-on').value;if(!v){toast('اختر اليوم');return}roll(t,v);toast('✓ الجاية '+rel(t.due))}
  else if(d.m==='skip'){t.due=addRep(t.due||T,t.rep);if(t.due<T)t.due=addRep(T,t.rep);toast('تخطيتها. الجاية '+rel(t.due))}
  else if(d.m==='del'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='متأكد؟ اضغط مرة ثانية';return}delete L.tasks[MID];MID=null;save();close();render();toast('انحذفت');return}
  save();close();render();return}
 if(d.me&&MID&&L.tasks[MID]){stop();const t=L.tasks[MID],v=d.v;
  if(d.me==='post'){t.due=addDays(t.due&&t.due>T?t.due:T,+v);t.post=(t.post||0)+1;save();close();render();toast('تأجّلت لـ'+rel(t.due));return}
  if(d.me==='due')t.due=v||null;
  else if(d.me==='rep'){if(v){t.rep=repOf(v);if(!t.due)t.due=t.last?addRep(t.last,t.rep):T}else{delete t.rep;delete t.km;delete t.fixed}}
  else if(d.me==='fixed')t.fixed=+v;
  else if(d.me==='q'||d.me==='est')t[d.me]=+v;
  else if(d.me==='cat')t.cat=v;
  save();render();openMore(MID);return}
 if(d.car){stop();openCar();return}
 if(d.carp){stop();const i=$('car-km');i.value=(+i.value||0)+ +d.carp;return}
 if(b.id==='car-ok'){stop();L.set.km=+$('car-km').value||0;save();close();render();toast('العداد: '+L.set.km.toLocaleString('en')+' كم');return}
},true);

function openPlan(p){const tp=TPL[p.tpl]||TPL.gen;PL={title:(p.tpl==='yt'||p.tpl==='raise')?tp.name:p.title||tp.name,ic:tp.ic,cat:p.cat==='شخصي'?'المشاريع':p.cat,due:p.due&&p.due!=='done'?p.due:null,per:60,full:false,items:[]};
 tp.ph.forEach(([pn,ts],ph)=>ts.forEach(([t,est,full])=>PL.items.push({ph,pn,t,est,on:!full,full:!!full})));showPlan()}
function schedPL(){let day=TODAY(),left=PL.per,tot=0;PL.items.forEach(it=>{if(!it.on)return;tot+=it.est;let need=it.est;while(need>0){if(left<=0){day=addDays(day,1);left=PL.per}const tk=Math.min(need,left);need-=tk;left-=tk}it.due=day});return {end:day,tot}}
function showPlan(){const {end,tot}=schedPL(),on=PL.items.filter(i=>i.on);let warn='';
 if(PL.due&&end>PL.due){const days=Math.max(1,diff(PL.due,TODAY())+1),need=Math.ceil(tot/days/15)*15;warn=`<div class="warnbox">ما تلحق قبل ${rel(PL.due)} بـ${hm(PL.per)} يوميًا. تحتاج تقريبًا ${hm(need)} يوميًا، أو شيل بعض المهام.</div>`}
 const phs=[...new Set(PL.items.map(i=>i.ph))];let first=true;

 ${phs.map(ph=>{const its=PL.items.map((it,i)=>[it,i]).filter(([it])=>it.ph===ph);return `<div class="plph"><h4>المرحلة ${ph+1}: ${esc(its[0][0].pn)}<small>${ph?'تبدأ بعد المرحلة '+ph:''}</small></h4>${its.map(([it,i])=>{const tag=it.on&&first?(first=false,'<span class="tag">ابدأ هنا</span>'):'';return `<div class="pli${it.on?'':' off'}"><button class="mck${it.on?' on':''}" type="button" data-plon="${i}" aria-label="أبيها">${ic(MI.check,15,3)}</button><input type="text" data-plt="${i}" value="${esc(it.t)}" aria-label="المهمة">${tag}<select data-ple="${i}" aria-label="المدة">${[10,15,20,30,45,60,90,120,180].map(m=>`<option value="${m}"${m===it.est?' selected':''}>${hm(m)}</option>`).join('')}</select><span class="d">${it.on?rel(it.due):''}</span></div>`}).join('')}<button class="sbtn" type="button" data-pladd="${ph}" style="margin-top:6px">＋ مهمة</button></div>`}).join('')}
 <div class="load"><span>${on.length} مهمة · <b>${hm(tot)}</b></span><span>يخلص تقريبًا: <b>${rel(end)}</b></span></div>${warn}

function mNextGap(){const T=TODAY(),nm=nowMin(),pl=dayPlan(T);const g=pl.gs.find(g=>g.to-Math.max(g.from,nm)>=15);return g?{from:Math.max(g.from,nm),to:g.to}:null}
function mHeader(){const x=$('hx');if(!x)return;const k=mDay(),g=k===TODAY()?mNextGap():null;
 x.innerHTML=dayBar(k,'md')+(k!==TODAY()?'':`<div class="mhd"><span>${g?`وقتك الفاضي الجاي <b>${fmt(g.from)} إلى ${fmt(g.to)}</b>`:'ما بقى لك وقت فاضي اليوم'}</span><button type="button" class="mgo" data-tl="1">رتّبه لي</button></div>`)}
const PLBL=['ما سجلت','بالبيت','بالمسجد'];
let MD=null;const mDay=()=>MD||TODAY();
function dayName(k){const t=TODAY();if(k===t)return 'اليوم';if(k===addDays(t,-1))return 'أمس';if(k===addDays(t,1))return 'بكرة';const d=new Date(k+'T12:00');return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]}
function dayBar(k,a){return `<div class="ydays"><button type="button" data-${a}="-1" aria-label="اليوم اللي قبل">›</button><b>${dayName(k)}</b><button type="button" data-${a}="1" aria-label="اليوم اللي بعد">‹</button></div>`}
function mToday(){const T=mDay(),past=T<TODAY(),P=prayers(T),pd=L.pray[T]||{},pl=past?{placed:[],un:[]}:dayPlan(T);
 const pr=PR.map(([k,n])=>{const v=+pd[k]||0;return `<button type="button" class="mpr p${v}" data-pray="${k}" data-pd="${T}" aria-label="${n}: ${PLBL[v]}"><b>${n}</b><small>${v?PLBL[v]:fmt(P[k])}</small></button>`}).join('');
 const seen=new Set(),rows=[];
 pl.placed.filter(p=>p.it.task).forEach(p=>{seen.add(p.it.task);rows.push([p.it.task,p.it.t,`${hm(p.to-p.from)} · مقترح ${fmt(p.from)}`])});
 pl.un.forEach(([id,t])=>{if(!seen.has(id)){seen.add(id);rows.push([id,t,'ما لقيت لها وقت اليوم'])}});
 Object.entries(L.tasks).filter(([id,t])=>t.done&&t.doneAt===T&&!seen.has(id)).forEach(([id,t])=>rows.push([id,t,'خلصتها']));
 const left=rows.filter(([,t])=>!t.done).length;
 const hs=Object.entries(L.habits).filter(([,h])=>habDueOn(h,T));
 const ck=(on,attr)=>`<button type="button" class="mck${on?' on':''}" ${attr} aria-label="${on?'رجّع':'تم'}">${ic(MI.check,16,3)}</button>`;
 return `<section class="w mcard"><div class="mh"><h2>الصلاة</h2></div><div class="mprs">${pr}</div></section>
 <section class="w mcard"><div class="mh"><h2>${past?'اللي خلصته':'مهام '+(T===TODAY()?'اليوم':dayName(T))}</h2><small>${rows.length?(left?'باقي '+left:'خلصتها كلها'):''}</small></div>
 ${rows.length?rows.map(([id,t,sub])=>`<div class="mtr${t.done?' done':''}">${ck(t.done,`data-done="${id}"`)}<button type="button" class="tx" data-more="${id}"><span>${esc(t.t)}</span><small>${esc(t.done?'خلصتها':sub)}</small></button>${t.done?'':`<button type="button" class="mlater" data-later="${id}">أجّل</button>`}</div>`).join(''):`<p class="empty">${past?'ما خلصت مهام هذا اليوم.':'ما عليك مهام.'}</p>`}</section>
 <section class="w mcard"><div class="mh"><h2>العادات</h2><small>${hs.length?hs.filter(([,h])=>habDone(h,T)).length+' من '+hs.length:''}</small></div>
 ${hs.length?hs.map(([id,h])=>`<div class="mtr">${ck(habDone(h,T),`data-hab="${id}" data-hd="${T}"`)}<span class="tx"><span>${esc(h.name)}${h.x>1?' '+(h.log[T]||0)+'/'+h.x:''}</span></span><small class="mwk">${weekCount(h,T)} من ${h.t||((h.days&&h.days.length)||7)} هالأسبوع</small></div>`).join(''):'<p class="empty">ما عندك عادات هذا اليوم.</p>'}</section>`}
