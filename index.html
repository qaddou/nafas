<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#17202e;--muted:#5d6879;--line:#dde2ea;--accent:#e07a2f;--brand:#1f3a5f;--good:#2f8f5b;--bad:#c0392b;--warn:#c98a12;--soft:#eef2f7;color-scheme:light}
:root[data-mode="night"]{--bg:#0f1520;--surface:#18212f;--ink:#e8edf4;--muted:#9aa6b8;--line:#2a3547;--brand:#8db4e2;--soft:#1f2a3a;--good:#5cc28a;--bad:#e36b5d;--warn:#e0a83a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal','DejaVu Sans',sans-serif;font-size:15px;line-height:1.5;padding-bottom:84px}
button{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:8px}
h1{font-weight:800;font-size:21px;margin:0;color:var(--brand)}
header .sub{color:var(--muted);font-size:13px;margin-inline-start:auto}
.mode,.sbtn{border:1px solid var(--line);background:var(--surface);color:var(--brand);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.sbtn.ok{background:var(--good);border-color:var(--good);color:#fff}.sbtn.pri{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.sbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.greet{margin:4px 0 10px}.greet b{font-size:17px}.greet span{color:var(--muted);font-size:13px;display:block}
/* quick add bar */
.qadd{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qadd button{flex:1;min-width:0;border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--brand);cursor:pointer}
/* widgets */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;position:relative}
.w h2{font-size:15px;margin:0 0 6px;color:var(--brand);display:flex;align-items:center;gap:6px}
.w h2 small{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:12px}
.w.wide{grid-column:1/-1}
.empty{color:var(--muted);font-size:13px;padding:4px 0}
.empty button{margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:8px}
.kpi b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand)}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi b.g{color:var(--good)}.kpi b.r{color:var(--bad)}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:6px;background:var(--good)}
.bar i.w2{background:var(--warn)}.bar i.r{background:var(--bad)}
.li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12px;color:var(--muted)}
.li .t span.late{color:var(--bad);font-weight:700}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--brand);background:transparent;cursor:pointer;flex:none;color:#fff;font-weight:800;padding:0}
.chk.on{background:var(--good);border-color:var(--good)}
.q{flex:none;font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px}
.q1{background:rgba(192,57,43,.14);color:var(--bad)}.q2{background:rgba(31,58,95,.12);color:var(--brand)}.q3{background:rgba(201,138,18,.16);color:var(--warn)}.q4{background:var(--soft);color:var(--muted)}
.amt{font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.amt.in{color:var(--good)}.amt.out{color:var(--bad)}
.load{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.load b{color:var(--ink)}
.warnbox{background:rgba(192,57,43,.1);color:var(--bad);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;margin-top:6px}
.hab{display:flex;flex-wrap:wrap;gap:6px}
.hab button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.hab button.on{background:var(--good);border-color:var(--good);color:#fff}
.hab button em{font-style:normal;font-size:11px;opacity:.8}
.cats .li .t b{font-weight:500}
/* edit mode */
.wtools{display:none;gap:4px;position:absolute;top:8px;left:8px}
.editing .wtools{display:flex}
.wtools button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;padding:0}
.editing .w{outline:2px dashed var(--accent);outline-offset:-2px}
.hiddenlist{margin-top:10px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(15,21,32,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 8px;color:var(--brand);font-size:17px}
.f{margin-top:8px}.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px;font-weight:700}
.f input,.f select{width:100%;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:4px 10px;font-size:13px;cursor:pointer}
.opts button.on{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.acts{display:flex;gap:6px;margin-top:12px;justify-content:flex-end}
.msg{font-size:12.5px;color:var(--bad);min-height:18px;margin-top:4px}
.view{display:none}.view.on{display:block}
.soon{border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted)}
.tabsm{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px;margin-bottom:10px}
.tabsm button{flex:1;border:0;background:none;border-radius:8px;padding:6px 0;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tabsm button.on{background:var(--surface);color:var(--brand)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hidden{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* nav inside each app: bottom on phone, side rail on wide screens */
nav.appnav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:4px 6px calc(6px + env(safe-area-inset-bottom))}
nav.appnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;padding:6px 0;color:var(--muted);font-weight:700;border:0;background:none;cursor:pointer;border-radius:10px}
nav.appnav button i{font-style:normal;font-size:19px;line-height:1.1}
nav.appnav button.on{color:var(--accent)}
.home-btn{border:1px solid var(--line);background:var(--surface);color:var(--brand);border-radius:16px;padding:4px 10px;font-size:13px;cursor:pointer;font-weight:700}
/* launcher */
.apps{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px}
.tileapp{display:flex;align-items:center;gap:14px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;width:100%}
.tileapp .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.tileapp .tx{flex:1;min-width:0}.tileapp .tx b{display:block;font-size:19px;font-weight:800;color:var(--brand)}
.tileapp .tx span{display:block;color:var(--muted);font-size:13px}
.tileapp .tx em{display:block;font-style:normal;font-size:14px;font-weight:700;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.tileapp .go{color:var(--muted);font-size:20px}
.ic.l{background:rgba(224,122,47,.15)}.ic.m{background:rgba(47,143,91,.15)}.ic.t{background:rgba(31,58,95,.13)}
:root[data-mode="night"] .ic.t{background:rgba(141,180,226,.18)}
.stack{display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.apps{grid-template-columns:repeat(3,1fr)}.tileapp{flex-direction:column;text-align:center;padding:22px 14px}.tileapp .go{display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}}
@media (min-width:1000px){
 body.inapp{padding-bottom:20px}
 nav.appnav{top:0;bottom:0;right:0;left:auto;width:86px;flex-direction:column;justify-content:flex-start;gap:4px;padding:70px 6px 10px;border-top:0;border-left:1px solid var(--line)}
 nav.appnav button{flex:none;padding:10px 0}
 body.inapp .app{padding-right:100px}
 .sheet{align-items:center}.sheet .box{border-radius:18px}
 .toast{bottom:24px}
}
/* ===== قِرش ===== */
.qask{display:flex;gap:6px;margin-bottom:8px}.qask input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 12px}
.qans{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;position:relative}.qans.warn{border-color:var(--bad)}
.qans>.sbtn{position:absolute;top:6px;inset-inline-end:6px;padding:2px 8px}.qsum{display:flex;flex-wrap:wrap;gap:6px}.qsum>*{background:var(--bg);border-radius:10px;padding:3px 8px;font-size:13.5px}.qsum b{font-size:16px}em.w,.qsum .w{color:#b9770e;font-style:normal}
.qaccs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:8px}.qacc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;cursor:pointer;text-align:start}.qacc span{font-size:12px;color:var(--muted)}.qacc b{font-variant-numeric:tabular-nums}
.sbar{display:flex;height:12px;border-radius:7px;overflow:hidden;margin:4px 0 8px}.sbar i{display:block;height:100%}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.amt small{color:var(--muted);font-weight:400}
.mchart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}.mc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}.mc i{display:block;width:70%;min-height:2px;background:var(--brand);border-radius:6px 6px 2px 2px}.mc:last-child i{background:var(--accent)}.mc b{font-size:10.5px;font-weight:700;color:var(--muted)}.mc span{font-size:11px;color:var(--muted)}
button.li.qtx{width:100%;border:0;background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}.qic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;color:#fff}
.amt.tr{color:var(--muted)}.qday{font-size:12px;color:var(--muted);font-weight:700;margin:10px 2px 2px}
.qfil{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}.qfil input,.qfil select,.qin{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 9px}.qin{width:110px;text-align:center}
.qsel{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.qsel select{min-width:0;font-size:13px}
.qmonth{display:flex;align-items:center;gap:8px;justify-content:center;margin:2px 0 6px}.qmonth b{min-width:120px;text-align:center}
.qbud .li{padding:6px 0}.bar.big{height:12px}.note{font-size:12.5px;color:var(--muted)}
.qtab{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}.qtab td,.qtab th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:start}.qtab th{color:var(--muted);font-weight:700;font-size:12px}.g{color:var(--good)}.r{color:var(--bad)}
.li.off{opacity:.55}.qlink{border:0;background:none;color:inherit;font:inherit;text-align:start;cursor:pointer;padding:0}
.qinv{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:8px;overflow:hidden}.qinvh{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;color:inherit;font:inherit;text-align:start;padding:12px;cursor:pointer}.qinvh .t{flex:1;min-width:0}.qinvh .t b{display:block}.qinvh .t span{font-size:12.5px;color:var(--muted)}.qinvh .r2{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}.qinvh .r2 span{font-size:12.5px}
.qinvb{padding:0 12px 12px}.qprice{display:flex;gap:6px;margin:8px 0}.qprice input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 9px}
.qcmp{display:flex;flex-direction:column;gap:6px;margin-top:8px}.qcr{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-size:12.5px}.qcr div{display:flex;flex-direction:column;gap:2px}.qcr i{display:block;height:7px;border-radius:4px}.qcr i.c{background:#bbb}.qcr i.v.g{background:var(--good)}.qcr i.v.r{background:var(--bad)}
.qdanger{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}.sbtn.bad{color:var(--bad);border-color:var(--bad)}
.opts.sub{margin-top:6px;padding-inline-start:10px;border-inline-start:3px solid var(--line)}.opts.small button{font-size:18px;padding:3px 7px}.cdot{width:30px;height:30px;border-radius:50%!important;border:2px solid transparent!important}.cdot.on{border-color:var(--ink)!important}
input.big{font-size:22px!important;font-weight:800}
details summary{cursor:pointer;color:var(--accent);font-size:13.5px;margin:6px 0}
[dir="ltr"] .qmonth button[data-qm="-1"],[dir="ltr"] .qmonth button[data-qbm="-1"]{order:0}



#login{background:var(--bg);align-items:center}#login .box{border-radius:18px;max-width:380px;text-align:center}
#login input{width:180px;font:inherit;font-size:20px;letter-spacing:4px;text-align:center;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px}
.home-btn{text-decoration:none;display:inline-block}
a.tileapp{text-decoration:none;color:inherit}
#sync{display:block;font-size:11.5px;color:var(--muted);text-align:center;min-height:16px;margin-top:-4px}
.yh-x{display:flex;flex-direction:column;gap:8px;padding:0 0 12px}.yh-x:empty{display:none}
.yav{margin-inline-start:auto;width:40px;height:40px;border-radius:999px;border:0;background:var(--gold);color:var(--goldink);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.hdate{font-size:14px;color:rgba(255,255,255,.85)}
.hpray{align-self:stretch;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;color:#FFFFFF;text-decoration:none;font-size:14px;min-height:44px}
.hpray>span:nth-child(2){flex:1}
.hpray .dots{display:flex;gap:4px}.hpray .dots i{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.35)}.hpray .dots i.on{background:var(--gold)}
.hrem{display:flex;flex-direction:column;gap:0}
.hh{display:flex;align-items:baseline;margin-bottom:4px}.hh h2{margin:0;font-size:16px}.hh small{margin-inline-start:auto;color:var(--muted);font-size:13px}
.hrow{display:flex;align-items:center;gap:10px;min-height:52px;border-top:1px solid var(--line);padding:10px 0;color:inherit;text-decoration:none}
.hrow>i{width:4px;align-self:stretch;border-radius:0}
.hrow .tx{flex:1;display:flex;flex-direction:column;min-width:0}.hrow .tx span{font-size:15px}.hrow .tx small{color:var(--muted);font-size:12.5px}
.hrow svg{color:var(--muted);flex:none}
.hnote{margin:6px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.htiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.htile{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:118px;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(30,27,46,.05)}
.htile .hn{font-size:13px;font-weight:700}
:root[data-mode="night"] .htile .hn{filter:brightness(1.9)}
.htile .hv{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}.htile .hv b{font-size:24px;font-variant-numeric:tabular-nums}.htile .hv small{font-size:13px;color:var(--muted)}
.htile .hl{font-size:12.5px;color:var(--muted);line-height:1.5}.htile .hl .good{color:var(--good)}.htile .hl .bad{color:var(--bad)}
.hbar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.hbar i{display:block;height:100%;border-radius:8px}
.hedit{display:flex;align-items:center;gap:6px;margin:8px auto 0;border:0;background:none;color:var(--muted);font:inherit;font-size:13.5px;min-height:44px;cursor:pointer}
.hpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.hpick button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;min-height:48px;padding:0 12px;font:inherit;cursor:pointer}
.hpick button i{width:10px;height:10px;border-radius:10px}.hpick button.on{border-color:var(--gold);background:var(--soft);font-weight:700}
.greet{display:none}
.hrow .tx small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a-home #sync{display:none}
:root{--bg:#F3ECE0;--surface:#FFFFFF;--ink:#1E1B2E;--muted:#5C5668;--line:#E6DCCB;--soft:#F7F1E6;--gold:#D9A441;--goldink:#1E1B2E;--sadu:#A8322D;--app:#1E1B2E;--appt:#1E1B2E;--accent:var(--appt);--brand:var(--appt);--good:#3F5A2A;--bad:#A8322D;--warn:#8A6015;--ckbg:var(--app);--ckfg:#FFFFFF;--mint:#D9A441;color-scheme:light}
body.a-luqma{--app:#3F5A2A;--appt:#3F5A2A}body.a-qirsh{--app:#7A5310;--appt:#7A5310}body.a-mufakkira{--app:#7A2420;--appt:#7A2420}body.a-home{--app:#1E1B2E;--appt:#1E1B2E}
:root[data-mode="night"]{--bg:#15131F;--surface:#211E2E;--ink:#F3ECE0;--muted:#B9B2C4;--line:#353049;--soft:#2A2639;--good:#A9C98A;--bad:#F08C84;--warn:#E8C27A;--ckfg:#FFFFFF;color-scheme:dark}
:root[data-mode="night"] body{--appt:#E8C27A}
body{font-family:'IBM Plex Sans Arabic','Tajawal',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:96px}
h1,.yk{font-family:'Reem Kufi','IBM Plex Sans Arabic',sans-serif}
.yh{display:block;background:var(--app);color:#FFFFFF;padding:10px 14px 0}
.yh-in{max-width:1180px;margin:0 auto}
.yh-row{display:flex;align-items:center;gap:8px;min-height:52px}

<script>
{
const APP_ID='nafas',APP_KEY='home',PFX='',BUILD='20261126173206';

// ===== calculations =====
const repDue=(t,k)=>(t.due&&t.due<=k)||(t.km&&(t.km.at||0)+t.km.every-((L.set&&L.set.km)||0)<=0);
function projOpen(t){if(!t.proj)return true;let mn=99;for(const x of Object.values(L.tasks))if(x.proj===t.proj&&!x.done&&x.ph<mn)mn=x.ph;return t.ph===mn}
const openTasks=()=>{const k=TODAY();return Object.entries(L.tasks).filter(([,t])=>!t.done&&(t.rep?repDue(t,k):projOpen(t)))};
function rank(t,today){ // lower = do first
 const late=t.due&&t.due<today, dueT=t.due===today;
 return (late?0:dueT?10:20)+({1:0,2:3,3:5,4:9}[t.q]??9)+(t.due?Math.min(9,Math.max(0,(new Date(t.due)-new Date(today))/864e5)):9)/10}
function plan(){ // fill today's hours by priority, never past capacity
 const today=TODAY(),cap=L.set.cap;let used=0;const pick=[],rest=[];
 openTasks().sort((a,b)=>rank(a[1],today)-rank(b[1],today)).forEach(([id,t])=>{
  if(t.q===4&&!(t.due&&t.due<=today)){rest.push([id,t]);return}
  const m=t.est||30; if(used+m<=cap){pick.push([id,t]);used+=m}else rest.push([id,t])});
 return {pick,rest,used,cap}}
function habitDue(h,k){if(h.paused)return false;if(h.t)return true;return !h.days||!h.days.length||h.days.includes(new Date(k+'T12:00').getDay())}

 let s=0,k=addDays(TODAY(),-60);const m=Math.pow(.5,1/14);
 if(h.t){let d=0;for(let i=1;i<=28;i++)if((h.log[addDays(TODAY(),-i)]||0)>=(h.x||1))d++;return Math.min(100,Math.round(d/(h.t*4)*100))}
 for(let i=0;i<=60;i++,k=addDays(k,1)){if(k<(h.from||'')||!habitDue(h,k))continue;if(k===TODAY()&&!h.log[k])continue;s=s*m+((h.log[k]||0)>=(h.x||1)?1-m:0)}
 return Math.round(s*100)}

 let n=0,k=TODAY();if(!ok(k))k=addDays(k,-1);for(let i=0;i<400;i++){if(k<(h.from||''))break;if(habitDue(h,k)||h.paused){if(ok(k))n++;else if(!h.paused)break}k=addDays(k,-1)}return n}

function taskRow(id,t){const today=TODAY();const late=t.due&&t.due<today;

{const m=load('fit-mode',null);setMode(m||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'))}

  else authFail(j)}catch(e){syncMsg('ما فيه نت. محفوظ بالجهاز ويرتفع لحاله.',false)}

function rowInfo(k,j){let v={};try{v=JSON.parse(j||'{}')}catch(e){}const r=k.slice(2).split(':')[0];
 if(!j)return {t:'محذوف'};
 if(r==='tx')return {t:v.type==='in'?'دخل':v.type==='tr'?'تحويل':'مصروف',a:(v.h||0)/100,n:v.desc||v.cat||'',x:v.date||''};
 if(r==='cat')return {t:'تصنيف',n:v.name||''};
 if(r==='com')return {t:'التزام',a:(v.h||0)/100,n:v.name||'',x:v.due||''};
 if(r==='inv')return {t:'سهم',n:v.name||'',a:v.price||''};
 if(r==='iop')return {t:'عملية سهم',n:v.type||'',a:v.qty||'',x:v.date||''};
 if(r==='acc')return {t:'حساب',a:(v.open||0)/100,n:v.name||''};

// يجهّز البيانات: تصنيفات افتراضية + تحويل البيانات القديمة بدون ما يضيع شي
function finPrep(L){
 L.set=Object.assign({salary:0,payday:27,defAcc:'',lang:'ar',tabs:QTABS.map(x=>x[0]),off:[]},L.set||{});
 if(!Object.keys(L.cat).length){for(const k of ['out','in'])DEFCATS[k].forEach(([id,a,e,ic,co],i)=>L.cat['c_'+id]={name:a,en:e,icon:ic,color:co,kind:k,parent:'',ord:i})}
 const byName={};for(const [id,c] of Object.entries(L.cat))byName[c.kind+':'+c.name]=id;
 const mapCat=(name,kind)=>{if(!name)return 'c_'+(kind==='in'?'iother':'other');if(L.cat[name])return name;if(byName[kind+':'+name])return byName[kind+':'+name];
  const o=OLDCAT[name];if(o&&L.cat['c_'+o])return 'c_'+o;if(name==='أخرى')return 'c_'+(kind==='in'?'iother':'other');
  const id='c_'+kind+'_'+qn(name).replace(/\s+/g,'_');if(!L.cat[id])L.cat[id]={name,icon:'🏷️',color:'#7f8c8d',kind,parent:'',ord:50};byName[kind+':'+name]=id;return id};
 for(const x of Object.values(L.tx)){if(x.type!=='tr'&&x.cat&&!L.cat[x.cat])x.cat=mapCat(x.cat,x.type==='in'?'in':'out')}
 for(const [k,v] of Object.entries(L.bud||{})){if(!L.cat[k]&&v){const id=mapCat(k,'out');L.bud[id]=v;delete L.bud[k]}else if(!L.cat[k])delete L.bud[k]}
 for(const a of Object.values(L.acc)){if(OLDKIND[a.kind])a.kind=OLDKIND[a.kind];if(!a.kind)a.kind='cur'}
 return L}

const catOf=id=>{const c=L.cat[id]||{name:T('بدون تصنيف','Uncategorized'),icon:'❔',color:'#95a5a6',kind:'out'};const y=YCOL[String(c.color||'').toLowerCase()];return y?Object.assign({},c,{color:y}):c};
const catName=id=>{const c=catOf(id);return (LANG()==='en'&&c.en?c.en:c.name)};
const catFull=id=>{const c=catOf(id);return (c.parent&&L.cat[c.parent]?catName(c.parent)+' › ':'')+catName(id)};
const topCat=id=>{const c=L.cat[id];return c&&c.parent&&L.cat[c.parent]?c.parent:id};
const accName=id=>id?(L.acc[id]?(L.acc[id].bank&&L.acc[id].bank!==L.acc[id].name?L.acc[id].bank+' · ':'')+L.acc[id].name:T('حساب محذوف','Deleted account')):'';
const isPaid=x=>x.paid!==false;
function iopCash(o){const t=Math.round((o.qty||0)*(o.price||0)*100);return o.type==='buy'?-(t+(o.fee||0)):o.type==='sell'?t-(o.fee||0):o.type==='div'?(o.h||0):o.type==='fee'?-(o.fee||0):0}
function accBal(id){const a=L.acc[id];if(!a)return 0;let b=a.open||0;
 for(const x of Object.values(L.tx)){if(!isPaid(x))continue;if(x.type==='in'&&x.acc===id)b+=x.h;else if(x.type==='out'&&x.acc===id)b-=x.h;else if(x.type==='tr'){if(x.acc===id)b-=x.h;if(x.to===id)b+=x.h}}
 for(const o of Object.values(L.iop||{}))if(o.acc===id)b+=iopCash(o);return b}

// ---- الاستثمار: متوسط التكلفة (العمولة داخلة في التكلفة) ----
function holding(id){const h=L.inv[id];const ops=Object.entries(L.iop||{}).filter(([,o])=>o.inv===id).sort((a,b)=>(a[1].date||'')<(b[1].date||'')?-1:(a[1].date||'')>(b[1].date||'')?1:(a[1].t||0)-(b[1].t||0));
 let qty=0,cost=0,real=0,div=0,fees=0,put=0,got=0;
 for(const [,o] of ops){const t=Math.round((o.qty||0)*(o.price||0)*100);
  if(o.type==='buy'){qty+=o.qty;cost+=t+(o.fee||0);put+=t+(o.fee||0);fees+=o.fee||0}
  else if(o.type==='sell'){const q=Math.min(o.qty,qty);const avg=qty?cost/qty:0;const pr=Math.round(q*o.price*100)-(o.fee||0);real+=pr-avg*q;cost-=avg*q;qty-=q;fees+=o.fee||0;got+=pr}
  else if(o.type==='div')div+=o.h||0;
  else if(o.type==='fee'){cost+=o.fee||0;fees+=o.fee||0;put+=o.fee||0}
  else if(o.type==='adj'){qty=o.qty}}
 if(Math.abs(qty)<1e-9)qty=0;if(!qty)cost=0;
 const price=h.price!=null&&h.price!==''?+h.price:null;const value=price!=null?Math.round(qty*price*100):Math.round(cost);
 const unreal=value-cost,total=unreal+real+div;
 return {qty,cost:Math.round(cost),avg:qty?cost/qty/100:0,value,unreal:Math.round(unreal),real:Math.round(real),div,fees,put,got,total:Math.round(total),pct:put?total/put*100:0,price,closed:!qty&&ops.length>0,ops}}
function portfolio(){let cost=0,value=0,total=0,div=0,put=0;const rows=[];for(const id of Object.keys(L.inv||{})){const h=holding(id);if(L.inv[id].arch)continue;cost+=h.cost;value+=h.value;total+=h.total;div+=h.div;put+=h.put;rows.push([id,h])}return {cost,value,total,div,put,pct:put?total/put*100:0,rows}}

function nextDue(d,ev){const x=new Date(d+'T12:00');if(ev==='w')x.setDate(x.getDate()+7);else if(ev==='y')x.setFullYear(x.getFullYear()+1);else x.setMonth(x.getMonth()+1);return dkey(x)}

const monthEnd=(p=ym())=>{const [y,m]=p.split('-').map(Number);return dkey(new Date(y,m,0))};
function budget(p=ym()){const out=monthSum(p,'out'),inc=monthSum(p,'in');const sal=L.set.salary||0;const base=Math.max(sal,inc);
 const planned=txIn(p,'out',false).filter(([,x])=>!isPaid(x)).reduce((a,[,x])=>a+x.h,0);
 const reserved=p===ym()?comDue(monthEnd(p)).reduce((a,[,c])=>a+c.h,0):0;
 return {sal,inc,base,paid:out,planned,reserved,total:out+planned+reserved,avail:base-out-planned-reserved,pct:base?out/base*100:0}}
function finTotals(){let bank=0,shown=[];for(const [id,a] of Object.entries(L.acc)){const b=accBal(id);if(a.kind!=='inv')bank+=b;shown.push([id,b])}const na=noAccNet();const pf=portfolio();
 const invCash=Object.entries(L.acc).filter(([,a])=>a.kind==='inv').reduce((s,[id])=>s+accBal(id),0);
 return {bank:bank+na,na,inv:pf.value+invCash,total:bank+na+pf.value+invCash,pf}}
