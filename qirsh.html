<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#17202e;--muted:#5d6879;--line:#dde2ea;--accent:#e07a2f;--brand:#1f3a5f;--good:#2f8f5b;--bad:#c0392b;--warn:#c98a12;--soft:#eef2f7;color-scheme:light}
:root[data-mode="night"]{--bg:#0f1520;--surface:#18212f;--ink:#e8edf4;--muted:#9aa6b8;--line:#2a3547;--brand:#8db4e2;--soft:#1f2a3a;--good:#5cc28a;--bad:#e36b5d;--warn:#e0a83a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal','DejaVu Sans',sans-serif;font-size:15px;line-height:1.5;padding-bottom:84px}
button{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;padding:0 14px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:8px}
h1{font-weight:800;font-size:21px;margin:0;color:var(--brand)}
header .sub{color:var(--muted);font-size:13px;margin-inline-start:auto}
.mode,.sbtn{border:1px solid var(--line);background:var(--surface);color:var(--brand);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.sbtn.ok{background:var(--good);border-color:var(--good);color:#fff}.sbtn.pri{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.sbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.greet{margin:4px 0 10px}.greet b{font-size:17px}.greet span{color:var(--muted);font-size:13px;display:block}
/* quick add bar */
.qadd{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qadd button{flex:1;min-width:0;border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--brand);cursor:pointer}
/* widgets */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;position:relative}
.w h2{font-size:15px;margin:0 0 6px;color:var(--brand);display:flex;align-items:center;gap:6px}
.w h2 small{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:12px}
.w.wide{grid-column:1/-1}
.empty{color:var(--muted);font-size:13px;padding:4px 0}
.empty button{margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:8px}
.kpi b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--brand)}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi b.g{color:var(--good)}.kpi b.r{color:var(--bad)}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;border-radius:6px;background:var(--good)}
.bar i.w2{background:var(--warn)}.bar i.r{background:var(--bad)}
.li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12px;color:var(--muted)}
.li .t span.late{color:var(--bad);font-weight:700}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--brand);background:transparent;cursor:pointer;flex:none;color:#fff;font-weight:800;padding:0}
.chk.on{background:var(--good);border-color:var(--good)}
.q{flex:none;font-size:11px;font-weight:800;border-radius:8px;padding:1px 7px}
.q1{background:rgba(192,57,43,.14);color:var(--bad)}.q2{background:rgba(31,58,95,.12);color:var(--brand)}.q3{background:rgba(201,138,18,.16);color:var(--warn)}.q4{background:var(--soft);color:var(--muted)}
.amt{font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.amt.in{color:var(--good)}.amt.out{color:var(--bad)}
.load{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}
.load b{color:var(--ink)}
.warnbox{background:rgba(192,57,43,.1);color:var(--bad);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;margin-top:6px}
.hab{display:flex;flex-wrap:wrap;gap:6px}
.hab button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.hab button.on{background:var(--good);border-color:var(--good);color:#fff}
.hab button em{font-style:normal;font-size:11px;opacity:.8}
.cats .li .t b{font-weight:500}
/* edit mode */
.wtools{display:none;gap:4px;position:absolute;top:8px;left:8px}
.editing .wtools{display:flex}
.wtools button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;padding:0}
.editing .w{outline:2px dashed var(--accent);outline-offset:-2px}
.hiddenlist{margin-top:10px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(15,21,32,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 8px;color:var(--brand);font-size:17px}
.f{margin-top:8px}.f label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px;font-weight:700}
.f input,.f select{width:100%;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opts button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:4px 10px;font-size:13px;cursor:pointer}
.opts button.on{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.acts{display:flex;gap:6px;margin-top:12px;justify-content:flex-end}
.msg{font-size:12.5px;color:var(--bad);min-height:18px;margin-top:4px}
.view{display:none}.view.on{display:block}
.soon{border:1px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--muted)}
.tabsm{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:10px;margin-bottom:10px}
.tabsm button{flex:1;border:0;background:none;border-radius:8px;padding:6px 0;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.tabsm button.on{background:var(--surface);color:var(--brand)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hidden{display:none!important}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* nav inside each app: bottom on phone, side rail on wide screens */
nav.appnav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:4px 6px calc(6px + env(safe-area-inset-bottom))}
nav.appnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;padding:6px 0;color:var(--muted);font-weight:700;border:0;background:none;cursor:pointer;border-radius:10px}
nav.appnav button i{font-style:normal;font-size:19px;line-height:1.1}
nav.appnav button.on{color:var(--accent)}
.home-btn{border:1px solid var(--line);background:var(--surface);color:var(--brand);border-radius:16px;padding:4px 10px;font-size:13px;cursor:pointer;font-weight:700}
/* launcher */
.apps{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px}
.tileapp{display:flex;align-items:center;gap:14px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;width:100%}
.tileapp .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.tileapp .tx{flex:1;min-width:0}.tileapp .tx b{display:block;font-size:19px;font-weight:800;color:var(--brand)}
.tileapp .tx span{display:block;color:var(--muted);font-size:13px}
.tileapp .tx em{display:block;font-style:normal;font-size:14px;font-weight:700;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.tileapp .go{color:var(--muted);font-size:20px}
.ic.l{background:rgba(224,122,47,.15)}.ic.m{background:rgba(47,143,91,.15)}.ic.t{background:rgba(31,58,95,.13)}
:root[data-mode="night"] .ic.t{background:rgba(141,180,226,.18)}
.stack{display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.apps{grid-template-columns:repeat(3,1fr)}.tileapp{flex-direction:column;text-align:center;padding:22px 14px}.tileapp .go{display:none}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}}
@media (min-width:1000px){
 body.inapp{padding-bottom:20px}
 nav.appnav{top:0;bottom:0;right:0;left:auto;width:86px;flex-direction:column;justify-content:flex-start;gap:4px;padding:70px 6px 10px;border-top:0;border-left:1px solid var(--line)}
 nav.appnav button{flex:none;padding:10px 0}
 body.inapp .app{padding-right:100px}
 .sheet{align-items:center}.sheet .box{border-radius:18px}

}

.qinvb{padding:0 12px 12px}.qprice{display:flex;gap:6px;margin:8px 0}.qprice input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 9px}

<script>
{
const APP_ID='qirsh',APP_KEY='qirsh',PFX='q:',BUILD='20261126155930';

// ===== data (in the real app: sheet "life", one row per item, newest wins) =====
// L and save() come from each app
const TCATS=['العبادة','العناية الشخصية','الصحة','اللياقة','البيت','السيارة','الجامعة','العمل','المسار المهني','المال','العائلة','التعلم','المشاريع','شخصي','أخرى'];

// ===== calculations =====
const repDue=(t,k)=>(t.due&&t.due<=k)||(t.km&&(t.km.at||0)+t.km.every-((L.set&&L.set.km)||0)<=0);
function projOpen(t){if(!t.proj)return true;let mn=99;for(const x of Object.values(L.tasks))if(x.proj===t.proj&&!x.done&&x.ph<mn)mn=x.ph;return t.ph===mn}

function rank(t,today){ // lower = do first
 const late=t.due&&t.due<today, dueT=t.due===today;
 return (late?0:dueT?10:20)+({1:0,2:3,3:5,4:9}[t.q]??9)+(t.due?Math.min(9,Math.max(0,(new Date(t.due)-new Date(today))/864e5)):9)/10}
function plan(){ // fill today's hours by priority, never past capacity
 const today=TODAY(),cap=L.set.cap;let used=0;const pick=[],rest=[];
 openTasks().sort((a,b)=>rank(a[1],today)-rank(b[1],today)).forEach(([id,t])=>{
  if(t.q===4&&!(t.due&&t.due<=today)){rest.push([id,t]);return}
  const m=t.est||30; if(used+m<=cap){pick.push([id,t]);used+=m}else rest.push([id,t])});
 return {pick,rest,used,cap}}
function habitDue(h,k){if(h.paused)return false;if(h.t)return true;return !h.days||!h.days.length||h.days.includes(new Date(k+'T12:00').getDay())}
function habitScore(h){ // Loop-style strength: every done day pulls it up, every missed due day pulls it down
 let s=0,k=addDays(TODAY(),-60);const m=Math.pow(.5,1/14);
 if(h.t){let d=0;for(let i=1;i<=28;i++)if((h.log[addDays(TODAY(),-i)]||0)>=(h.x||1))d++;return Math.min(100,Math.round(d/(h.t*4)*100))}
 for(let i=0;i<=60;i++,k=addDays(k,1)){if(k<(h.from||'')||!habitDue(h,k))continue;if(k===TODAY()&&!h.log[k])continue;s=s*m+((h.log[k]||0)>=(h.x||1)?1-m:0)}
 return Math.round(s*100)}
function streak(h){const ok=k=>(h.log[k]||0)>=(h.x||1);if(h.t){let n=0,ws=addDays(TODAY(),-new Date(TODAY()+'T12:00').getDay()-7);for(let i=0;i<60;i++){let c=0;for(let j=0;j<7;j++)if(ok(addDays(ws,j)))c++;if(c>=h.t)n++;else break;ws=addDays(ws,-7)}return n}
 let n=0,k=TODAY();if(!ok(k))k=addDays(k,-1);for(let i=0;i<400;i++){if(k<(h.from||''))break;if(habitDue(h,k)||h.paused){if(ok(k))n++;else if(!h.paused)break}k=addDays(k,-1)}return n}

const hm=m=>m>=60?Math.floor(m/60)+' س'+(m%60?' '+m%60+' د':''):m+' د';
function taskRow(id,t){const today=TODAY();const late=t.due&&t.due<today;
 const when=!t.due?'بدون موعد':late?'متأخرة '+Math.round((new Date(today)-new Date(t.due))/864e5)+' يوم':t.due===today?'اليوم':t.due===addDays(today,1)?'بكرة':dshort(t.due);

// ===== core shared by نَفَس / قِرش / مُفكّرة: login, sync with the sheet, auto-update, links =====

 if(INGAS)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));

let SYNC=load('fit-sync',{url:'',pin:''});
const isMain=()=>SYNC.who==='main'&&!!SYNC.pin;

const YQ_MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14A8 8 0 1 1 10 4a7 7 0 0 0 10 10z"/></svg>',YQ_SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>';
function setMode(m){document.documentElement.dataset.mode=m;store('fit-mode',m);const b=$('mode');if(b){b.innerHTML=m==='night'?YQ_SUN:YQ_MOON;b.setAttribute('aria-label',m==='night'?'الوضع الصباحي':'الوضع المسائي')}}
{const m=load('fit-mode',null);setMode(m||(matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'))}

let ITEMS=load(IK,{}),PEND=load(PK,[]);
function itemsTo(L0,pfx=PFX){ // rebuild the app's data object from ITEMS
 const L=JSON.parse(JSON.stringify(L0));
 for(const [k,it] of Object.entries(ITEMS)){if(!it.j||!k.startsWith(pfx))continue;const rest=k.slice(pfx.length),i=rest.indexOf(':');let v;try{v=JSON.parse(it.j)}catch(e){continue}
  if(i<0){if(rest in L)L[rest]=Object.assign({},L[rest],v)}else{const c=rest.slice(0,i);if(L[c]&&typeof L[c]==='object')L[c][rest.slice(i+1)]=v}}
 return L}
function diffSave(L,SINGLE,COLL){ // compare app data with ITEMS, mark changed rows for upload
 const now=Date.now(),seen=new Set();let ch=false;
 const put=(k,v)=>{seen.add(k);const j=JSON.stringify(v);if(!ITEMS[k]||ITEMS[k].j!==j){ITEMS[k]={u:Math.max(now,(ITEMS[k]||{}).u+1||0),j};if(!PEND.includes(k))PEND.push(k);ch=true}};

 COLL.forEach(c=>Object.entries(L[c]||{}).forEach(([id,v])=>put(PFX+c+':'+id,v)));

 if(ch){store(IK,ITEMS);store(PK,PEND);clearTimeout(window.__pt);window.__pt=setTimeout(push,800)}}

 if(isQ)return {q:finAnswer(text)};

 let type=/حولت|تحويل|حول |transfer/.test(s)?'tr':/استلمت|جاني|نزل|نزلي|وصلني|دخل |ربحت|استرجعت|استرداد|راتب|received|salary/.test(s)?'in':'out';
 const r={type,h,date:dateFind(text),paid:!/ما دفعت|ما سددت|لسا ما|باقي ادفع|بدفع|بسدد/.test(s)};
 if(type==='tr'){const tm=s.match(/\s(?:الي\s|الى\s|لحساب|للحساب|ل(?=\S))\s*(?:حساب\s*)?(.+)$/),fm=s.match(/\sمن\s+(?:حساب\s+)?(.+?)(?=\s(?:الي|الى|لحساب|ل\S)|$)/);
  r.to=tm?accFind(tm[1]):null;r.acc=fm?accFind(fm[1]):null;if(!r.acc)r.acc=L.set.defAcc&&L.set.defAcc!==r.to?L.set.defAcc:Object.keys(L.acc).find(id=>id!==r.to&&!L.acc[id].arch)||null}
 else{const fm=s.match(/(?:من|ب|في|على)\s*(?:حساب\s+)?([a-z0-9\u0600-\u06ff]+(?:\s+[a-z0-9]+)?)/g);let a=null;if(fm)for(const x of fm){a=accFind(x);if(a)break}r.acc=a||L.set.defAcc||'';
  r.cat=catFind(text,type==='in'?'in':'out')||('c_'+(type==='in'?'iother':'other'))}
 let d=' '+String(text)+' ';d=d.replace(/\s(\d[\d,٬.٫]*|[٠-٩][٠-٩,٬.٫]*)\s*(الف|ألف)?\s*(ريال|ر\.س|ر س|sar)?(?=\s)/i,' ').replace(/ريال|ر\.س|sar/gi,' ');
 d=d.replace(/^\s*(انا\s+|اليوم\s+|امس\s+|أمس\s+)?(دفعت|اشتريت|صرفت|حطيت|سددت|حولت|استلمت|جاني|نزل|وصلني|شريت)\s*/,' ');
 d=d.replace(/\s(من|في|على|الى|إلى|ل)\s*(حساب\s*)?([^\s]+(\s[^\s]+)?)\s*$/,(m,a,b,c)=>accFind(c)?' ':m).replace(/\s(من|في|على|الى|إلى)\s*(حساب\s*)?([^\s]+)/g,(m,a,b,c)=>accFind(c)?' ':m);
 d=d.replace(/\s+/g,' ').trim().replace(/^(بـ|ب|حق|على)\s+/,'').replace(/\s(بـ|ب)$/,'');

function finAnswer(text){const s=qn(text);const p=ym();const nodata=T('ما عندي بيانات مسجلة لهالفترة.','No recorded data for that period.');
 let per=p,perN=T('هالشهر','this month');if(/الشهر الماضي|الشهر اللي فات|last month/.test(s)&&!/مقارن|تغير|compare/.test(s)){per=ym(-1);perN=T('الشهر الماضي','last month')}

 if(/مقارن|تغير|compare|change/.test(s)){const a=monthSum(ym(),'out'),b=monthSum(ym(-1),'out');if(!a&&!b)return nodata;const d=a-b;
  const ca=byCat(ym()),cb=byCat(ym(-1));const diffs=[...new Set([...Object.keys(ca),...Object.keys(cb)])].map(c=>[c,(ca[c]||0)-(cb[c]||0)]).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])).slice(0,3);
  return T(`صرفت هالشهر ${M(a)} والشهر الماضي ${M(b)}. `,`You spent ${M(a)} this month vs ${M(b)} last month. `)+(d>0?T(`يعني زاد ${M(d)}`,`Up ${M(d)}`):d<0?T(`يعني نقص ${M(-d)}`,`Down ${M(-d)}`):T('نفس الشي.','Same.'))+(b?` (${d>0?'+':''}${Math.round(d/b*100)}%)`:'')+(diffs.length?T('. أكثر تغيّر: ','. Biggest changes: ')+diffs.map(([c,v])=>catName(c)+' '+(v>0?'+':'')+MN(v)).join('، '):'')}
 if(/تبقي|باقي من|المتاح|يتبقى|تبقى|left|remain|available/.test(s)){const b=budget();if(!b.base&&!b.paid)return T('ما سجلت راتب ولا دخل لهالشهر. حط راتبك من المزيد ← الإعدادات.','No salary or income recorded this month. Set it in More › Settings.');
  return T(`من ${M(b.base)}: صرفت ${M(b.paid)}`,`Of ${M(b.base)}: spent ${M(b.paid)}`)+(b.reserved?T(`، ومحجوز للالتزامات ${M(b.reserved)}`,`, reserved for commitments ${M(b.reserved)}`):'')+(b.planned?T(`، ومخطط ${M(b.planned)}`,`, planned ${M(b.planned)}`):'')+T(`. المتاح لك: ${M(b.avail)}.`,`. Available: ${M(b.avail)}.`)}
 if(/اكثر|وين تروح|اعلى|most|top/.test(s)){const b=Object.entries(byCat(per)).sort((a,b)=>b[1]-a[1]);if(!b.length)return nodata;const tot=b.reduce((a,x)=>a+x[1],0);
  return T(`أكثر شي صرفت عليه ${perN}: `,`Top spending ${perN}: `)+b.slice(0,3).map(([c,v])=>`${catName(c)} ${M(v)} (${Math.round(v/tot*100)}%)`).join('، ')}
 if(/رصيد|عندي فلوس|كم عندي|balance|how much do i have/.test(s)){const t=finTotals();return T(`مجموع فلوسك ${M(t.total)}: بالحسابات ${M(t.bank)} والاستثمار ${M(t.inv)}.`,`Total ${M(t.total)}: accounts ${M(t.bank)}, investments ${M(t.inv)}.`)+' '+Object.entries(L.acc).filter(([,a])=>!a.arch).map(([id])=>accName(id)+' '+M(accBal(id))).join('، ')}
 if(/استثمار|محفظه|اسهم|سهم|portfolio|stock/.test(s)){const pf=portfolio();if(!pf.rows.length)return T('ما سجلت أسهم للحين.','No holdings yet.');return T(`قيمة محفظتك ${M(pf.value)}، حطيت فيها ${M(pf.put)}، والربح أو الخسارة ${M(pf.total)} (${pf.pct.toFixed(1)}%)، منها توزيعات ${M(pf.div)}.`,`Portfolio value ${M(pf.value)}, invested ${M(pf.put)}, P/L ${M(pf.total)} (${pf.pct.toFixed(1)}%), dividends ${M(pf.div)}.`)}
 if(/دخل|دخلي|استلمت|income|earn/.test(s)){const [a,b,n]=rng();const v=sumR(a,b,'in');return v?T(`دخلك ${n}: ${M(v)}`,`Income ${n}: ${M(v)}`):nodata}
 if(/صرفت|مصروف|مصاريف|spent|spend/.test(s)){const [a,b,n]=rng();const c=catFind(text.replace(/صرفت|مصاريف|مصروف/g,''),'out');const v=sumR(a,b,'out',c);

function accUsed(id){return Object.values(L.tx).filter(x=>x.acc===id||x.to===id).length+Object.values(L.iop||{}).filter(o=>o.acc===id).length+Object.values(L.com||{}).filter(c=>c.acc===id).length}

const toNum=v=>{const n=parseFloat(String(v).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[٫,،]/g,'.'));return isFinite(n)?n:NaN};
function msave(){const k=MF.kind,x=MF.x,msg=t=>{$('m-msg').textContent=t};let id=MF.id;
 if(k==='out'||k==='in'||k==='tr'){const h=toH(mval('m-amt'));if(!(h>0))return msg(T('اكتب المبلغ صح','Enter a valid amount'));x.h=h;x.date=mval('m-date')||x.date||TODAY();x.note=mval('m-note');
  if(k==='tr'){if(!x.acc||!x.to)return msg(T('اختر الحسابين','Pick both accounts'));if(x.acc===x.to)return msg(T('اختر حسابين مختلفين','Pick two different accounts'));delete x.cat}
  else{x.desc=mval('m-desc');if(!x.cat)x.cat='c_'+(k==='in'?'iother':'other');if(!x.acc)delete x.acc}
  if(!id){id=uid();x.t=Date.now()}
  if(k==='out'&&MF.rep&&!x.com){const cid=uid();L.com[cid]={name:x.desc||catName(x.cat),h:x.h,cat:x.cat,acc:x.acc||'',every:MF.rep,due:nextDue(x.date,MF.rep),on:true};x.com=cid}
  L.tx[id]=x;
  if(k==='out'&&L.bud[topCat(x.cat)]){const s=byCat(x.date.slice(0,7))[topCat(x.cat)]||0,p=s/L.bud[topCat(x.cat)];toast(p>=1?T('⚠️ تجاوزت حد ','⚠️ Over limit: ')+catName(topCat(x.cat)):p>=.8?T('انتبه: صرفت ','Careful: ')+Math.round(p*100)+'% '+T('من حد ','of ')+catName(topCat(x.cat)):T('انحفظ ✓','Saved ✓'))}else toast(T('انحفظ ✓','Saved ✓'))}
 if(k==='acc'){x.name=mval('m-name');x.bank=mval('m-bank');if(!x.name&&!x.bank)return msg(T('اكتب اسم الحساب أو البنك','Enter a name or bank'));if(!x.name)x.name=x.bank;
  const want=mval('m-amt')===''?0:toH(mval('m-amt'));if(isNaN(want))return msg(T('اكتب الرصيد صح','Enter a valid balance'));
  if(!id){id=uid();x.open=want;x.ord=Object.keys(L.acc).length}else{x.open=(x.open||0)+(want-accBal(id))}
  L.acc[id]=x;if(MF.def==='1')L.set.defAcc=id;else if(MF.def==='0'&&L.set.defAcc===id)L.set.defAcc='';toast(T('انحفظ الحساب ✓','Account saved ✓'))}
 if(k==='cat'){x.name=mval('m-name');x.icon=mval('m-icon')||x.icon;if(!x.name)return msg(T('اكتب الاسم','Enter a name'));if(LANG()==='en'&&x.en!==undefined)x.en=x.name;
  if(x.parent&&L.cat[x.parent]&&L.cat[x.parent].parent)x.parent=L.cat[x.parent].parent;
  if(!id){id='c'+uid();x.ord=Object.keys(L.cat).length}L.cat[id]=x;toast(T('انحفظ التصنيف ✓','Saved ✓'))}
 if(k==='com'){x.name=mval('m-name');x.h=toH(mval('m-amt'));x.due=mval('m-date')||TODAY();if(!x.name)return msg(T('اكتب اسم الالتزام','Enter a name'));if(!(x.h>0))return msg(T('اكتب المبلغ','Enter amount'));if(!id)id=uid();L.com[id]=x;toast(T('انحفظ ✓','Saved ✓'))}
 if(k==='inv'){x.name=mval('m-name');x.sym=mval('m-sym');const pr=mval('m-price');if(!x.name)return msg(T('اكتب الاسم','Enter a name'));if(pr!==''){if(isNaN(toNum(pr)))return msg(T('السعر غلط','Bad price'));if(+x.price!==toNum(pr)){x.price=toNum(pr);x.pdate=TODAY()}}else x.price='';
  if(!id){id=uid();const q=toNum(mval('m-qty')),bp=toNum(mval('m-bp'));if(q>0){if(!(bp>0))return msg(T('اكتب سعر الشراء','Enter buy price'));L.iop[uid()]={inv:id,type:'buy',qty:q,price:bp,fee:mval('m-fee')?toH(mval('m-fee')):0,date:mval('m-date')||TODAY(),t:Date.now()};if(x.price==='')x.price=bp}}
  L.inv[id]=x;INVO=id;toast(T('انحفظ ✓','Saved ✓'))}
 if(k==='iop'){const hd=holding(x.inv);
  if(x.type==='buy'||x.type==='sell'){x.qty=toNum(mval('m-qty'));x.price=toNum(mval('m-bp'));x.fee=mval('m-fee')?toH(mval('m-fee')):0;if(!(x.qty>0))return msg(T('اكتب عدد الأسهم','Enter shares'));if(!(x.price>0))return msg(T('اكتب السعر','Enter price'));
   if(x.type==='sell'){const have=hd.qty+(id&&L.iop[id].type==='sell'?L.iop[id].qty:0);if(x.qty>have+1e-9)return msg(T('عندك ','You have ')+(+have.toFixed(4))+T(' سهم بس',' shares only'))}}
  if(x.type==='div'){x.h=toH(mval('m-amt'));if(!(x.h>0))return msg(T('اكتب المبلغ','Enter amount'))}
  if(x.type==='adj'){x.qty=toNum(mval('m-qty'));if(!(x.qty>=0))return msg(T('اكتب العدد','Enter count'))}
  x.date=mval('m-date')||TODAY();if(!x.acc)delete x.acc;if(!id){id=uid();x.t=Date.now()}L.iop[id]=x;
  if(x.type==='buy'&&(L.inv[x.inv].price===''||L.inv[x.inv].price==null))L.inv[x.inv].price=x.price;toast(T('انحفظت العملية ✓','Saved ✓'))}
 if(k==='bud'){document.querySelectorAll('[data-bud]').forEach(i=>{const h=i.value.trim()?toH(i.value):0;if(h>0)L.bud[i.dataset.bud]=h;else delete L.bud[i.dataset.bud]});toast(T('انحفظت الحدود ✓','Saved ✓'))}
 if(k==='set'){const h=mval('m-amt')?toH(mval('m-amt')):0;if(isNaN(h))return msg(T('اكتب الراتب صح','Bad amount'));L.set.salary=h;const d=parseInt(mval('m-day'));L.set.payday=d>=1&&d<=31?d:'';toast(T('انحفظ ✓','Saved ✓'))}
 save();close();MF=null;render()}

function askDelete(kind){const id=MF.id;let txt='',opts='';
 if(kind==='tx'){txt=T('بتنحذف هالحركة نهائيًا.','This record will be deleted permanently.');opts=`<button type="button" class="sbtn bad" data-qdo="tx">${T('احذفها','Delete')}</button>`}
 if(kind==='acc'){const n=accUsed(id);txt=n?T(`هالحساب مرتبط بـ ${n} عملية. الأرشفة تخفيه من الاختيارات وتحافظ على كل شي. الحذف يشيل الحساب بس، والعمليات تبقى وتطلع "حساب محذوف"، وأرصدتها ما تنحسب.`,`Linked to ${n} records. Archiving keeps everything. Deleting removes only the account; records stay as "Deleted account".`):T('الحساب ما عليه عمليات. بينحذف نهائيًا.','No records. It will be deleted.');
  opts=(n?`<button type="button" class="sbtn ok" data-qdo="acc-arch">🗄️ ${T('أرشفه بدال','Archive instead')}</button>`:'')+`<button type="button" class="sbtn bad" data-qdo="acc">${T('احذف الحساب','Delete account')}</button>`}
 if(kind==='cat'){const n=Object.values(L.tx).filter(x=>x.cat===id).length,sub=Object.values(L.cat).filter(c=>c.parent===id).length;const c=L.cat[id];const others=catOpts(c.kind).filter(([cid])=>cid!==id);
  txt=(n?T(`عليه ${n} حركة. اختر وين تروح:`,`${n} records use it. Move them to:`):T('ما عليه حركات.','No records.'))+(sub?T(` وتحته ${sub} تصنيف فرعي بيصيرون رئيسيين.`,` Its ${sub} sub-categories become main.`):'');
  opts=(n?`<select id="m-move">${others.map(([cid,x])=>`<option value="${cid}" ${cid===('c_'+(c.kind==='in'?'iother':'other'))?'selected':''}>${x.icon} ${esc(catName(cid))}</option>`).join('')}</select><button type="button" class="sbtn ok" data-qdo="cat-arch">🗄️ ${T('أرشفه بدال','Archive instead')}</button>`:'')+`<button type="button" class="sbtn bad" data-qdo="cat">${n?T('انقلها واحذف','Move & delete'):T('احذف','Delete')}</button>`}
 if(kind==='com'){const n=Object.values(L.tx).filter(x=>x.com===id).length;txt=T(`بينحذف الالتزام. ${n?n+' دفعة مسجلة تبقى بالحركات.':''}`,`The commitment will be deleted. ${n?n+' payments stay in activity.':''}`);opts=`<button type="button" class="sbtn bad" data-qdo="com">${T('احذف','Delete')}</button>`}
 if(kind==='inv'){const n=Object.values(L.iop).filter(o=>o.inv===id).length;txt=T(`بينحذف السهم مع ${n} عملية (شراء وبيع وتوزيعات). إذا انتهيت منه الأفضل تأرشفه.`,`Deletes the holding and ${n} operations. Archive instead if you just closed it.`);opts=`<button type="button" class="sbtn ok" data-qdo="inv-arch">🗄️ ${T('أرشفه بدال','Archive instead')}</button><button type="button" class="sbtn bad" data-qdo="inv">${T('احذف الكل','Delete all')}</button>`}
 if(kind==='iop'){txt=T('بتنحذف العملية وتتغير حسابات السهم.','The operation will be deleted and totals recalculated.');opts=`<button type="button" class="sbtn bad" data-qdo="iop">${T('احذف','Delete')}</button>`}
 const keep=MF;mopen('confirm',null,{html:`<h3>${T('متأكد؟','Are you sure?')}</h3><p>${txt}</p><div class="acts" style="flex-wrap:wrap">${opts}<button type="button" class="sbtn" data-qback="1">${T('رجوع','Back')}</button></div>`});MF.back=keep}
function doDelete(what){const b=MF.back,id=b.id;
 if(what==='tx'){delete L.tx[id]}
 if(what==='acc'){delete L.acc[id];if(L.set.defAcc===id)L.set.defAcc=''}
 if(what==='acc-arch'){L.acc[id].arch=true;if(L.set.defAcc===id)L.set.defAcc=''}
 if(what==='cat'){const mv=$('m-move')?$('m-move').value:'';for(const x of Object.values(L.tx))if(x.cat===id)x.cat=mv||('c_'+(L.cat[id].kind==='in'?'iother':'other'));for(const c of Object.values(L.cat))if(c.parent===id)c.parent='';if(L.bud[id]){if(mv)L.bud[mv]=(L.bud[mv]||0)+L.bud[id];delete L.bud[id]}delete L.cat[id]}
 if(what==='cat-arch')L.cat[id].arch=true;
 if(what==='com'){delete L.com[id]}
 if(what==='inv'){for(const [oid,o] of Object.entries(L.iop))if(o.inv===id)delete L.iop[oid];delete L.inv[id]}
 if(what==='inv-arch')L.inv[id].arch=true;
 if(what==='iop')delete L.iop[id];
 save();close();MF=null;render();toast(what.endsWith('arch')?T('انأرشف ✓','Archived ✓'):T('انحذف','Deleted'))}
function payCom(id){const c=L.com[id];const tid=uid();L.tx[tid]={type:'out',h:c.h,cat:c.cat||'c_other',acc:c.acc||undefined,date:TODAY(),desc:c.name,com:id,t:Date.now()};if(!L.tx[tid].acc)delete L.tx[tid].acc;
